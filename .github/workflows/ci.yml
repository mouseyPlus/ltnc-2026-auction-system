name: Java CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        shell: bash
        run: |
          if [[ -f ./mvnw ]]; then
            chmod +x ./mvnw
            ./mvnw --batch-mode clean test
          else
            mvn --batch-mode clean test
          fi
